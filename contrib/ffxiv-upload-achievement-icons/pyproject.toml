[tool.poetry]
name = "ffxiv-upload-achievement-icons"
version = "0.1.0"
description = ""
authors = ["Nicholas Avenell <nicholas@istic.net>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
paramiko = ">=3.5.1,<6.0.0"
requests = "^2.33.0"
tqdm = "^4.67.1"
pylint = "^3.3.7"
fabric = "^3.2.2"
pre-commit = "^4.5.1"
# Python port of SaintCoinach, used to export icons directly from the game
# install (replaces downloading/running SaintCoinach.Cmd.exe). The "images"
# extra pulls in Pillow, which is needed to write the PNGs. Pinned to a fixed
# commit so `poetry install` installs it straight from the lock rather than
# re-checking the remote branch head on every run (bump this rev to pick up
# saintcoinach-py updates).
saintcoinach = { git = "https://github.com/aquarion/saintcoinach-py.git", rev = "f36c994676746d79aa85b58f26949d192c32fedc", extras = ["images"] }

[tool.poetry.group.dev.dependencies]
flake8 = "^7.1.2"
black = "^26.3.1"
autopep8 = "^2.3.2"
isort = "^6.0.1"
pytest = "^9.0.2"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
