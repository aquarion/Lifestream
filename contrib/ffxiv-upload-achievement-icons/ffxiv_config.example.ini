[xivapi]
apikey=XXX
characters=XXX
icon_base=https://art.istic.net/iconography/ffxiv/

[local]
# Path to your FINAL FANTASY XIV installation
# (the folder that contains "game/sqpack").
ffxiv_installation=D:\Steam\steamapps\common\FINAL FANTASY XIV Online

# Base directory for the exported icon cache. A "<game_version>/ui/icon/..."
# tree is created underneath this (e.g. .../2024.08.21.0000.0000/ui/icon/...).
icon_directory=/mnt/e/Apps/SaintCoinach

# Where the local achievement database (and update timestamps) are stored.
data_directory=./data

[remote]
remote_server=myserver.example.com
remote_user=username
remote_icon_directory=hosts/icons.example.com/htdocs/iconography/ffxiv
